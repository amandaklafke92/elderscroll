<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElderScroll</title>
  <!-- Pixel fonts: Press Start 2P for labels/headings, VT323 for readable body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <!-- Shared layout skeleton first, then the persona skin paints on top. -->
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="personas/elders/theme.css" />
</head>
<body>

  <!-- Always-on webcam feed: sits behind everything, mirrored like a mirror. -->
  <video id="camera" autoplay muted playsinline></video>

  <!-- Confetti is drawn on this canvas during the success screen. -->
  <canvas id="confetti"></canvas>

  <!-- Tiny debug readout for tuning. Hidden until you press the "d" key. -->
  <div id="debug" class="hidden"></div>
  <!-- TESTING ONLY: visible status for presenter-key recordings. -->
  <div id="test-recording-status" class="hidden"></div>

  <!-- ===================== SCREENS ===================== -->

  <!-- START / LOADING -->
  <section id="screen-start" class="screen screen-opaque">
    <div class="center-stack">
      <h1 class="brand">ElderScroll</h1>
      <p class="subtitle">Learn technology with your body.</p>
      <button id="start-btn" class="big-action">Start</button>
      <p id="start-status" class="status"></p>
      <p class="presenter-hint">
        Testing keys: <b>S</b> = skip &nbsp;·&nbsp; <b>R</b> = record 5s
        &nbsp;·&nbsp; <b>P</b> = preview reel &nbsp;·&nbsp;
        <b>F</b> = final gift &nbsp;·&nbsp; <b>Space</b> = gesture
      </p>
    </div>
  </section>

  <!-- NAME — tags the finished reel in the Lovable video library -->
  <section id="screen-name" class="screen screen-opaque hidden">
    <div class="center-stack">
      <p id="name-eyebrow" class="intro-eyebrow"></p>
      <h1 id="name-question" class="intro-equation"></h1>
      <input id="name-input" class="name-input" type="text" autocomplete="off"
        maxlength="40" placeholder="Type your name" />
      <button id="name-btn" class="big-action">Begin</button>
    </div>
  </section>

  <!-- INTRO video (plays once after Start) -->
  <section id="screen-intro" class="screen screen-opaque hidden">
    <div class="video-frame">
      <video id="intro-video" class="hidden" playsinline></video>
      <div id="intro-placeholder" class="placeholder hidden">
        <div class="ph-icon">▶</div>
        <div class="ph-label">Intro</div>
        <div class="ph-sub">(placeholder — video missing)</div>
      </div>
    </div>
  </section>

  <!-- TUTORIAL (one video per lesson) -->
  <section id="screen-tutorial" class="screen screen-opaque hidden">
    <h2 id="tutorial-title" class="screen-title"></h2>
    <p id="tutorial-step-label" class="step-label"></p>
    <div class="video-frame">
      <video id="tutorial-video" class="hidden" playsinline></video>
      <div id="tutorial-placeholder" class="placeholder hidden">
        <div class="ph-icon">▶</div>
        <div class="ph-label">Tutorial video</div>
        <div class="ph-sub">(placeholder — video missing)</div>
      </div>
    </div>
  </section>

  <!-- GET READY (3s countdown before Practice 2; doubles as the
       lead-in window for the silent recording) -->
  <section id="screen-getready" class="screen screen-opaque hidden">
    <div class="center-stack">
      <h2 id="getready-text" class="screen-title"></h2>
      <div id="getready-count" class="getready-count"></div>
    </div>
  </section>

  <!-- PRACTICE (shared by Practice 1 and Practice 2). Transparent so the camera shows through. -->
  <section id="screen-practice" class="screen hidden">
    <p id="practice-instruction" class="instruction"></p>

    <div class="button-layer">
      <!-- Legacy bad button: structurally retained but kept hidden in the new flow. -->
      <button id="bad-btn" type="button" class="practice-btn bad-btn hidden">
        Wire my pension to a handsome prince.
      </button>
      <!-- Next button: shown only on the Click lesson (lesson.showNextButton). -->
      <button id="next-btn" type="button" class="practice-btn next-btn hidden">
        next
      </button>
    </div>

    <p id="help-text" class="help-text hidden"></p>
  </section>

  <!-- FAILURE feedback. Visual signal cue = the screen's red border + warning icon. -->
  <section id="screen-failure" class="screen screen-opaque hidden">
    <div class="center-stack">
      <div id="failure-cue" class="failure-cue">!</div>
      <h2 id="failure-text" class="screen-title"></h2>
    </div>
  </section>

  <!-- SUCCESS (shared, with confetti) -->
  <section id="screen-success" class="screen screen-opaque hidden">
    <div class="center-stack">
      <div class="success-tick">✓</div>
      <h2 id="success-msg" class="success-msg">Well done!</h2>
    </div>
  </section>

  <!-- GIFT — brief payoff message before the stitched reel starts -->
  <section id="screen-gift" class="screen screen-opaque hidden">
    <div class="center-stack">
      <h1 id="gift-text" class="gift-text"></h1>
    </div>
  </section>

  <!-- REVEAL — the five Practice 2 clips rendered into one downloadable reel -->
  <section id="screen-reveal" class="screen screen-opaque hidden">
    <div class="video-frame">
      <canvas id="reel-canvas"></canvas>
    </div>
    <div class="reveal-actions">
      <p id="upload-status" class="upload-status"></p>
      <a id="download-link" class="download-link hidden" target="_blank" rel="noopener"></a>
    </div>
    <video id="reel-source" class="hidden" playsinline muted></video>
  </section>

  <!-- Persona config + content load first, then the shared engine reads them. -->
  <script src="personas/elders/config.js"></script>
  <script src="personas/elders/content.js"></script>
  <script src="app.js"></script>
</body>
</html>
