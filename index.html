<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ElderScroll</title>
  <!-- Pixel fonts: Press Start 2P for labels/headings, VT323 for readable body text -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet" />
  <!-- Shared layout skeleton first, then the persona skin paints on top. -->
  <link rel="stylesheet" href="base.css" />
  <link rel="stylesheet" href="personas/elders/theme.css" />
</head>
<body>

  <!-- Always-on webcam feed: sits behind everything, mirrored like a mirror. -->
  <video id="camera" autoplay muted playsinline></video>

  <!-- Confetti is drawn on this canvas during the success screen. -->
  <canvas id="confetti"></canvas>

  <!-- Tiny debug readout for tuning. Hidden until you press the "d" key. -->
  <div id="debug" class="hidden"></div>

  <!-- A small message that pops up briefly (used by the lesson library). -->
  <div id="toast" class="hidden"></div>

  <!-- ===================== SCREENS ===================== -->

  <!-- START / LOADING -->
  <section id="screen-start" class="screen screen-opaque">
    <div class="center-stack">
      <h1 class="brand">ElderScroll</h1>
      <p class="subtitle">Learn technology with your body.</p>
      <button id="start-btn" class="big-action">Start</button>
      <p id="start-status" class="status"></p>
      <p class="presenter-hint">
        Presenter keys: <b>Space</b> = clap &nbsp;·&nbsp; <b>←</b> / <b>→</b> = lean &nbsp;·&nbsp; <b>d</b> = debug
      </p>
    </div>
  </section>

  <!-- INTRO (shared; content set per lesson) — explains the lesson, text only -->
  <section id="screen-intro" class="screen screen-opaque hidden">
    <div class="center-stack">
      <p  id="intro-eyebrow"  class="intro-eyebrow"></p>
      <h1 id="intro-equation" class="intro-equation"></h1>
      <p  id="intro-line"     class="intro-line"></p>
    </div>
  </section>

  <!-- COUNTDOWN (shared) — 3 · 2 · 1 before the video -->
  <section id="screen-countdown" class="screen screen-opaque hidden">
    <div id="countdown-number" class="countdown-number"></div>
  </section>

  <!-- TUTORIAL VIDEO (shared) — one video per lesson, nothing else on screen -->
  <section id="screen-tutorial" class="screen screen-opaque hidden">
    <div class="video-frame">
      <video id="tutorial-video" class="hidden" playsinline></video>
      <div id="tutorial-placeholder" class="placeholder hidden">
        <div class="ph-icon">▶</div>
        <div class="ph-label">Tutorial video</div>
        <div class="ph-sub">(coming soon)</div>
      </div>
    </div>
  </section>

  <!-- YOUR TURN (shared; content set per lesson) — primes the practice action -->
  <section id="screen-ready" class="screen screen-opaque hidden">
    <div class="center-stack">
      <h1 id="ready-title" class="ready-title"></h1>
      <p  id="ready-line"  class="ready-line"></p>
    </div>
  </section>

  <!-- PRACTICE (shared by Lesson 1 and Lesson 2). Transparent so the camera shows through. -->
  <section id="screen-practice" class="screen hidden">
    <p id="practice-instruction" class="instruction"></p>

    <div class="button-layer">
      <!-- Bad button: just LEFT of centre. Hidden in Lesson 1. -->
      <button id="bad-btn" type="button" class="practice-btn bad-btn hidden">
        Wire my pension to a handsome prince.
      </button>
      <!-- Next button: just RIGHT of centre. Present in both lessons. -->
      <button id="next-btn" type="button" class="practice-btn next-btn">
        next
      </button>
    </div>

    <p id="help-text" class="help-text hidden"></p>
  </section>

  <!-- SUCCESS (shared) -->
  <section id="screen-success" class="screen screen-opaque hidden">
    <div class="center-stack">
      <div class="success-tick">✓</div>
      <h2 class="success-msg">Well done!</h2>
    </div>
  </section>

  <!-- LESSON LIBRARY -->
  <section id="screen-library" class="screen screen-opaque hidden">
    <h2 class="library-instruction">Lean to move between lessons. Clap to start the one you want.</h2>
    <div id="library-cards" class="library-cards"></div>
  </section>

  <!-- Persona config + content load first, then the shared engine reads them. -->
  <script src="personas/elders/config.js"></script>
  <script src="personas/elders/content.js"></script>
  <script src="app.js"></script>
</body>
</html>
